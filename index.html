<script>/* Pure game rules. Coordinates and masks are shared by rendering and the solver. */
(function (root) {
'use strict';
const directions = { up:[0,-1], right:[1,0], down:[0,1], left:[-1,0] };
function createBoard(rows) {
 if (!Array.isArray(rows) || !rows.length || !rows[0].length || rows.some(r=>typeof r!=='string'||r.length!==rows[0].length||/[^#.SO]/.test(r))) throw Error('Invalid rectangular board');
 const width=rows[0].length, height=rows.length, cells=[], lookup=new Map(); let start=-1, starts=0;
 rows.forEach((row,y)=>[...row].forEach((type,x)=>{if(type!=='#'){const id=cells.length; cells.push({id,x,y,stop:type==='O'}); lookup.set(y*width+x,id); if(type==='S'){start=id;starts++;}}}));
 if(starts!==1 || cells.length>30) throw Error('Board needs one start and at most 30 walkable cells');
 const fullMask=2**cells.length-1;
 const moves=cells.map(cell=>Object.fromEntries(Object.entries(directions).map(([name,[dx,dy]])=>{
  let x=cell.x,y=cell.y,mask=0; const path=[];
  while(true){x+=dx;y+=dy;if(x<0||x>=width||y<0||y>=height)break;const id=lookup.get(y*width+x);if(id===undefined)break;path.push(id);mask|=1<<id;if(cells[id].stop)break;}
  return [name,{path,mask,position:path.length?path[path.length-1]:cell.id}];
 })));
 return {rows,width,height,cells,lookup,start,fullMask,moves};
}
function createState(board){return {position:board.start,mask:1<<board.start,steps:0,complete:board.cells.length===1,path:[],moved:false};}
function slide(board,state,direction){
 const move=board.moves[state.position]?.[direction];
 if(!move||!move.path.length||state.complete)return {...state,path:[],moved:false};
 const mask=state.mask|move.mask;
 return {position:move.position,mask,steps:state.steps+1,complete:mask===board.fullMask,path:move.path.slice(),moved:true};
}
function count(mask){let n=0;while(mask){mask&=mask-1;n++;}return n;}
function solve(board,state,maxStates=120000){
 if(state.mask===board.fullMask)return [];
 const queue=[{position:state.position,mask:state.mask,parent:-1,direction:null}]; const seen=new Set([state.mask*32+state.position]);
 for(let head=0;head<queue.length&&head<maxStates;head++){
  const current=queue[head];
  for(const [direction,move] of Object.entries(board.moves[current.position])){
   if(!move.path.length)continue;
   const mask=current.mask|move.mask,key=mask*32+move.position;
   if(seen.has(key))continue;seen.add(key);
   const next={position:move.position,mask,parent:head,direction};
   if(mask===board.fullMask){const route=[direction];let node=current;while(node.parent!==-1){route.push(node.direction);node=queue[node.parent];}return route.reverse();}
   queue.push(next);
  }
 }
 return null;
}
function stars(steps,par){return steps<=par?3:steps<=par+Math.max(3,Math.ceil(par*.35))?2:1;}
function cleanSave(raw){
 const save={version:2,best:{},last:0,sound:false};
 if(!raw||typeof raw!=='object')return save;
 if(raw.best&&typeof raw.best==='object') for(const [key,value]of Object.entries(raw.best))if(/^(?:[0-9]|1[0-9])$/.test(key)&&Number.isInteger(value)&&value>0&&value<100000&&(raw.version===2||Number(key)<11))save.best[key]=value;
 if(Number.isInteger(raw.last)&&raw.last>=0&&raw.last<20)save.last=raw.last;
 save.sound=raw.sound===true;return save;
}
function recordWin(raw,index,steps){const save=cleanSave(raw);if(Number.isInteger(index)&&index>=0&&index<20&&Number.isInteger(steps)&&steps>0){save.best[index]=Math.min(save.best[index]??Infinity,steps);save.last=Math.min(index+1,19);}return save;}
const api={directions,createBoard,createState,slide,count,solve,stars,cleanSave,recordWin};
if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.GardenEngine=api;
})(typeof window!=='undefined'?window:globalThis);
</script>

}
function startLevel(index){if(!Number.isInteger(index)||index<0||index>=levels.length)return;resetView();view='playing';const level=levels[index],board=E.createBoard(level.rows);current={index,level,board,state:E.createState(board)};saved.last=index;persist();hints=0;started=performance.now();
 app.innerHTML=`<section class="game screen-enter"><div class="game-top"><button class="back-link" data-action="home">${icon('arrow')}回到花园</button><button class="chapter-pill" data-action="levels">第 ${level.chapter+1} 章 · ${chapters[level.chapter].name}　⌘</button></div><div class="game-layout"><div class="level-info"><p class="level-kicker">LITTLE GARDEN / 20</p><h1 class="level-heading"><span id="level-number">${String(index+1).padStart(2,'0')}</span>${level.name}</h1><p class="level-intent">${level.intent}</p><div class="level-stats"><div class="stat"><label>已开花</label><strong><span id="flower-count">1</span><small> / ${board.cells.length}</small></strong></div><div class="stat"><label>步数</label><strong id="move-count">0</strong></div></div><div class="garden-progress" role="progressbar" aria-label="花园点亮进度" aria-valuemin="0" aria-valuemax="${board.cells.length}" aria-valuenow="1"><span id="progress-fill"></span></div><div class="legend"><span><i></i>光种</span><span><i class="stop-dot"></i>${index>=10?'露珠停靠点':'轻轻滑动，直到尽头'}</span></div></div><div class="game-card"><div class="board-head"><span>SLIDE, WANDER & BLOOM</span>${icon('sprout')}</div><div class="garden-frame"><div id="board" class="board" role="group" tabindex="0" aria-label="花园棋盘。在棋盘上向上下左右滑动，或使用下方方向按钮。" data-busy="false" style="--cols:${board.width};--rows:${board.height}"></div></div><p id="live-message" class="board-hint" aria-live="polite">${index===0?'向右滑动，让第一排小花醒来。':index===10?'遇到蓝色露珠会停下；再滑一次继续走。':'在棋盘上滑动，或轻点下方方向键。'}</p><div class="direction-pad" aria-label="移动方向">${Object.keys(arrows).map(d=>`<button data-dir="${d}" aria-label="向${arrows[d]}移动" title="向${arrows[d]}移动"><svg style="transform:rotate(${rotations[d]}deg)" aria-hidden="true"><use href="#arrow"/></svg></button>`).join('')}</div><div class="tools"><button data-action="undo" disabled>${icon('undo')}撤回</button><button data-action="restart">${icon('restart')}重来</button><button data-action="hint">${icon('hint')}一点提示</button></div></div></div></section>`;
 const el=document.querySelector('#board');
 board.rows.forEach((row,y)=>[...row].forEach((ch,x)=>{const tile=document.createElement('div'),id=board.lookup.get(y*board.width+x);tile.className='tile'+(id===undefined?' blocked':board.cells[id].stop?' stop':'');if(id!==undefined){tile.dataset.cell=id;tile.innerHTML='<span class="bud"></span>';}el.appendChild(tile);}));
 const seed=document.createElement('span');seed.className='seed';seed.setAttribute('aria-hidden','true');el.appendChild(seed);paint(current.state);bindSwipe(el);
}
function paint(state,newId=null){if(!current||view!=='playing')return;const el=document.querySelector('#board');if(!el)return;for(const cell of current.board.cells){const tile=el.querySelector(`[data-cell="${cell.id}"]`),lit=!!(state.mask&(1<<cell.id));if(lit!==tile.classList.contains('lit')){tile.classList.toggle('lit',lit);tile.innerHTML=lit?flower():'<span class="bud"></span>';tile.classList.toggle('just-lit',lit&&newId===cell.id);}}
 const cell=current.board.cells[state.position];el.style.setProperty('--x',cell.x);el.style.setProperty('--y',cell.y);document.querySelector('#flower-count').textContent=E.count(state.mask);document.querySelector('#move-count').textContent=state.steps;document.querySelector('#progress-fill').style.width=(E.count(state.mask)/current.board.cells.length*100)+'%';document.querySelector('.garden-progress').setAttribute('aria-valuenow',E.count(state.mask));document.querySelector('[data-action="undo"]').disabled=!history.length||busy;
}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function move(direction){if(view!=='playing'||!current||busy||modal.open||current.state.complete)return;const before=current.state,next=E.slide(current.board,before,direction),el=document.querySelector('#board');if(!next.moved){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');message('这边到尽头了，试试换个方向。');return;}
 busy=true;el.dataset.busy='true';const token=epoch;history.push(before);document.querySelectorAll('.hinted').forEach(b=>b.classList.remove('hinted'));let mask=before.mask;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 for(const id of next.path){if(token!==epoch)return;const fresh=!(mask&(1<<id));mask|=1<<id;paint({...next,position:id,mask},fresh?id:null);if(fresh)tone(380+E.count(mask)*18,.075);await wait(reduced?0:65);}
 if(token!==epoch)return;current.state=next;busy=false;el.dataset.busy='false';paint(next);message(next.complete?'每一朵小花，都收到了你的光。':current.board.cells[next.position].stop?'停在露珠上了。换个方向，或继续向前。':`还有 ${current.board.cells.length-E.count(next.mask)} 格小径，等你来点亮。`);
 if(next.complete){await wait(reduced?0:420);if(token===epoch)result();}
}
function message(text){const el=document.querySelector('#live-message');if(el)el.textContent=text;}
function undo(){if(!current||view!=='playing'||busy||!history.length)return;current.state=history.pop();paint(current.state);message('退回一步，给自己另一种可能。');}
function hint(){if(!current||view!=='playing'||busy||current.state.complete)return;const path=E.solve(current.board,current.state);if(!path?.length){message('试试撤回几步，或重新出发，换一条路线。');return;}hints++;const d=path[0];document.querySelectorAll('.hinted').forEach(b=>b.classList.remove('hinted'));document.querySelector(`[data-dir="${d}"]`).classList.add('hinted');message(`一点提示：试试向${arrows[d]}滑动。`);}
function result(){if(!current||!current.state.complete||view!=='playing')return;view='result';const {index,level,state}=current;const rating=E.stars(state.steps,level.par),seconds=Math.max(1,Math.round((performance.now()-started)/1000)),last=index===19;saved=E.recordWin(saved,index,state.steps);persist();tone(660,.3);
 app.innerHTML=`<section id="result" class="result screen-enter"><p class="eyebrow">${last?'THE GARDEN IS AWAKE':'A LITTLE GARDEN, IN BLOOM'}</p><div class="result-art" aria-hidden="true">${flower()}<span class="result-spark">✧</span></div><h1 id="result-title">${last?'满园微光，因你而亮。':'这座花园，开花了。'}</h1><p class="result-subtitle">${last?'走过最后一条小径，也别忘了回头看看。':`第 ${String(index+1).padStart(2,'0')} 座 · ${level.name}<br>每一次小小的前进，都值得被看见。`}</p><div class="stars" aria-label="获得${rating}颗星">${[1,2,3].map(i=>icon('star',i>rating?'unearned':'')).join('')}</div><div class="result-stats"><div><strong>${state.steps}</strong><span>本次步数</span></div><div><strong>${level.par}</strong><span>三星目标</span></div><div><strong>${seconds<60?seconds+'″':Math.floor(seconds/60)+'′'+String(seconds%60).padStart(2,'0')+'″'}</strong><span>花开用时</span></div></div><div class="result-actions"><button class="secondary" data-action="replay">再逛一遍</button><button class="primary" data-action="${last?'finish':'next'}">${last?'回望我的花园':'下一座小花园'}${icon('arrow')}</button></div><p class="result-note">已点亮 ${Object.keys(saved.best).length} / 20 座花园${storageOK?' · 进度已保存在本机':' · 本次进度暂无法保存'}<br>${rating===3?'刚刚好的路线，刚刚好的你。':'花开就很美。也可以少绕几步，再试一次。'}</p><button class="small-link" data-action="levels">看看所有小花园</button></section>`;window.scrollTo({top:0,behavior:'instant'});
}
function openModal(kind){document.querySelector('#modal-title').textContent=kind==='levels'?'选一座小花园':'让微光，沿途开花';document.querySelector('#modal-body').innerHTML=kind==='levels'?`<p class="modal-intro">四段小旅程，二十次花开。可以按顺序慢慢走，也可以挑一座喜欢的花园。</p>${chapters.map((c,ch)=>`<section class="level-group"><h3>0${ch+1} / ${c.name} <span style="color:var(--muted);font-size:10px">　${c.sub}</span></h3><div class="level-grid">${levels.slice(ch*5,ch*5+5).map(l=>`<button class="level-tile ${saved.best[l.id-1]?'completed':''}" data-level="${l.id-1}" aria-label="第${l.id}关 ${l.name}">${String(l.id).padStart(2,'0')}<small>${saved.best[l.id-1]?'★'.repeat(E.stars(saved.best[l.id-1],l.par)):'·'}</small></button>`).join('')}</div></section>`).join('')}`:`<p class="modal-intro">你是一颗小小的光种。经过的土地会开花，把每一格小径点亮，就能唤醒这座花园。</p><div class="help-step"><b>01</b><div><strong>滑一下，一直走到尽头</strong><p>在棋盘上向上下左右滑动。光种会直行，直到遇到边界或青苔。也可以点方向按钮，电脑上可用方向键或 WASD。</p></div></div><div class="help-step"><b>02</b><div><strong>走过的路，也能再走</strong><p>花不会消失，不必一笔画完。随时撤回、重来，或要一点提示。没有倒计时，也没有步数失败。</p></div></div><div class="help-step"><b>03</b><div><strong>第 11 关，遇见露珠</strong><p>蓝色圆环是停靠点，光种经过就会停下。下一次滑动时，可以换个方向，也可以继续向前。</p></div></div><p class="help-footer">完成即得一星；接近最短路线得两星；达到最短步数得三星。提示不扣星。声音默认关闭，可在右上角开启。进度仅保存在当前浏览器。</p>`;if(!modal.open)modal.showModal();}
function bindSwipe(el){let pointer=null;el.addEventListener('pointerdown',e=>{if(e.isPrimary===false||e.button!==0)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId);});el.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');});el.addEventListener('pointercancel',()=>{pointer=null;});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.dir){move(b.dataset.dir);return;}if(b.dataset.level!==undefined){startLevel(Number(b.dataset.level));return;}switch(b.dataset.action){case 'home':case 'finish':home();break;case 'start':startLevel(saved.last);break;case 'levels':openModal('levels');break;case 'help':openModal('help');break;case 'close':modal.close();break;case 'undo':undo();break;case 'restart':case 'replay':if(current)startLevel(current.index);break;case 'hint':hint();break;case 'next':if(current)startLevel(current.index+1);break;case 'sound':saved.sound=!saved.sound;persist();syncSound();tone();toast(saved.sound?'声音已开启':'声音已关闭');break;}});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
document.addEventListener('keydown',e=>{if(view!=='playing'||modal.open||e.repeat)return;const dirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(dirs[e.key]){e.preventDefault();move(dirs[e.key]);}else if(e.key.toLowerCase()==='z'){undo();}});
home();syncSound();if(campaignUpdated){persist();toast('第12—20关已重新设计，旧关纪录已重置；前11关纪录保留。');}
})();
</script>
</body></html>
